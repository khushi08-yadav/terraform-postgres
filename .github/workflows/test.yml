name: Postgres Helm Deploy Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-sync:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Get Docker Image Tag
        run: |
          TAG=$(git rev-parse --short=6 HEAD)
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Docker Image Tag: $TAG"


      - name: Build Docker Image
        run: |
          docker build \
            -t khushi08yadav/new-postgres-k8s:$TAG \
            .


      - name: Push Docker Image
        run: |
          docker push khushi08yadav/new-postgres-k8s:$TAG


      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2


      - name: Configure SSH Private Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/id_file
          chmod 600 ~/.ssh/id_file


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest


      - name: Terraform Init
        run: terraform init


      - name: Terraform Plan
        run: terraform plan


      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Wait for Kubernetes
        run: |
          for i in {1..30}; do
            ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              -i ~/.ssh/id_file \
              ubuntu@${{ secrets.EC2_HOST }} \
              "kubectl get nodes" && break

            echo "Waiting for Kubernetes..."
            sleep 10
          done

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: latest


           - name: Deploy PostgreSQL with Helm
        run: |
          ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o ConnectTimeout=30 \
            -i ~/.ssh/id_file \
            ubuntu@${{ secrets.EC2_HOST }} \
            "mkdir -p ~/project && \
             cd ~/project && \
             if [ -d terraform-postgres/.git ]; then \
               cd terraform-postgres && \
               git pull origin main; \
             else \
               git clone https://github.com/khushi08-yadav/terraform-postgres.git && \
               cd terraform-postgres; \
             fi && \
             echo 'Waiting for Kubernetes...' && \
             until kubectl get nodes >/dev/null 2>&1; do \
               sleep 10; \
             done && \
             echo 'Kubernetes is ready' && \
             helm upgrade --install postgres-k8s . \
             --namespace postgresql \
             --create-namespace \
             --set image.repository=khushi08yadav/new-postgres-k8s \
             --set image.tag=$TAG"
             
      - name: Verify PostgreSQL Deployment
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_file \
            ubuntu@${{ secrets.EC2_HOST }} \
            "kubectl get pods -n postgresql && \
             kubectl get pvc -n postgresql && \
             kubectl get svc -n postgresql"

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
